<!DOCTYPE html>
<!-- Share image template (1200x630). Render with: node tools/render-og.js -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Literata:opsz,wght@7..72,400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;overflow:hidden;position:relative;background:#fbf8f1;
    background-image:linear-gradient(rgba(60,90,140,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(60,90,140,.09) 1px,transparent 1px);
    background-size:30px 30px;color:#23211e;font-family:Literata,Georgia,serif}
  .margin{position:absolute;top:0;bottom:0;left:92px;width:2px;background:rgba(201,76,60,.45)}
  .text{position:absolute;left:140px;top:104px;width:640px}
  .hi{font-family:Caveat;font-size:44px;color:#5d5953;margin:0}
  h1{font-family:Caveat;font-weight:700;font-size:84px;line-height:.95;margin:6px 0 24px;white-space:nowrap}
  h1 span{position:relative;z-index:0}
  h1 span::before{content:"";position:absolute;z-index:-1;left:-6px;right:-10px;top:52%;bottom:2%;
    background:repeating-linear-gradient(-20deg,#e7c65a 0 5px,rgba(231,198,90,.55) 5px 9px);transform:rotate(-1.5deg);filter:url(#crayon)}
  p.role{font-size:28px;line-height:1.4;margin:0;max-width:560px}
  .url{position:absolute;left:140px;bottom:56px;font-family:Caveat;font-weight:700;font-size:40px}
  .url b{color:#c94c3c}
  .photo{position:absolute;right:76px;top:70px;width:320px}
  .photo .h1{position:absolute;inset:-14px 30px 60px -18px;background:repeating-linear-gradient(-35deg,#3b4fa0 0 5px,transparent 5px 10px);filter:url(#crayon);transform:rotate(-3deg)}
  .photo .h2{position:absolute;inset:55% -16px 10px 45%;background:repeating-linear-gradient(55deg,#c94c3c 0 4px,transparent 4px 9px);filter:url(#crayon);transform:rotate(4deg)}
  .photo img{position:relative;display:block;width:100%;filter:grayscale(1) contrast(1.05);border:3px solid #23211e;border-radius:6px 14px 8px 12px/12px 6px 14px 8px;transform:rotate(1.5deg)}
  .eq{position:absolute;font-family:Caveat;color:#3b4fa0;opacity:.75}
  svg.d{position:absolute}
</style></head>
<body>
  <svg width="0" height="0" style="position:absolute"><filter id="crayon"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
  <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter></svg>
  <div class="margin"></div>
  <div class="text">
    <p class="hi">hi, I'm</p>
    <h1><span>Ajmal Ibn</span><br>Mohammed Althaf</h1>
    <p class="role">Physicist from Kerala. PhD researcher,<br>teacher, and co-founder of QuantumX.</p>
  </div>
  <div class="url">ajmal<b>.</b>science</div>
  <div class="eq" style="left:140px;top:44px;font-size:34px">Ĥψ = Eψ</div>
  <div class="eq" style="left:470px;bottom:56px;font-size:32px;color:#c94c3c">δ = PL³ / 3EI</div>
  <svg class="d" style="left:380px;top:30px" width="90" height="90" viewBox="0 0 120 120">
    <g fill="none" stroke="#23211e" stroke-width="2.4" stroke-linecap="round" filter="url(#wobble)">
      <circle cx="60" cy="60" r="44"/><ellipse cx="60" cy="60" rx="44" ry="13" stroke-dasharray="4 5"/><line x1="60" y1="60" x2="86" y2="28"/></g>
    <circle cx="86" cy="28" r="6" fill="#c94c3c"/></svg>
  <div class="photo"><span class="h1"></span><span class="h2"></span><img src="../img/portrait-900.jpg" alt=""></div>
</body></html>
